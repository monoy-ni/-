<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">
  <rect width="640" height="300" fill="#FDFCFA"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2A3A4A">出发前先跟它说好</text>

  <rect x="24" y="60" width="284" height="216" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
  <rect x="24" y="60" width="6" height="216" rx="3" fill="#20A0E0"/>
  <text x="52" y="98" font-size="17" font-weight="700" fill="#0060A0">规矩一：不许乱花钱</text>
  <text x="52" y="138" font-size="14" fill="#2A3A4A">预算 200 元，超了不能付</text>
  <rect x="52" y="168" width="232" height="40" rx="10" fill="#F0D9DC"/>
  <text x="68" y="194" font-size="14" fill="#C21F26">✕ 三层蛋糕 680 元</text>
  <rect x="52" y="218" width="232" height="40" rx="10" fill="#EAF4FB"/>
  <text x="68" y="244" font-size="14" fill="#4A8B3B">✓ 单层蛋糕 168 元</text>

  <rect x="332" y="60" width="284" height="216" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
  <rect x="332" y="60" width="6" height="216" rx="3" fill="#20A0E0"/>
  <text x="360" y="98" font-size="17" font-weight="700" fill="#0060A0">规矩二：卡住了就回来说</text>
  <text x="360" y="138" font-size="14" fill="#2A3A4A">A 店关门 → 换 B 店</text>
  <text x="360" y="164" font-size="14" fill="#2A3A4A">B 店卖完 → 换 C 店</text>
  <text x="360" y="190" font-size="14" fill="#2A3A4A">C 店也不送……</text>
  <rect x="360" y="212" width="232" height="46" rx="10" fill="#20A0E0"/>
  <text x="376" y="240" font-size="14" fill="#FFFFFF">连着几家都订不到，回来问你</text>
</svg>
